<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4500;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ff4500;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="url(#bg)" rx="8"/>
  <rect x="1" y="1" width="598" height="348" fill="none" stroke="#333" stroke-width="1" rx="8"/>

  <!-- Browser chrome dots -->
  <circle cx="20" cy="16" r="4" fill="#ff5f56"/>
  <circle cx="36" cy="16" r="4" fill="#ffbd2e"/>
  <circle cx="52" cy="16" r="4" fill="#27c93f"/>

  <!-- Title bar -->
  <text x="300" y="20" text-anchor="middle" fill="#666" font-size="9" font-family="sans-serif">ple — The Deterministic Intent Engine</text>

  <!-- Triangle diagram (simplified) -->
  <polygon points="300,55 380,140 220,140" fill="none" stroke="#444" stroke-width="1.5"/>
  <circle cx="300" cy="55" r="4" fill="#fff"/>
  <circle cx="380" cy="140" r="4" fill="#fff"/>
  <circle cx="220" cy="140" r="4" fill="#fff"/>

  <!-- Center core node -->
  <circle cx="300" cy="105" r="5" fill="#ff4500"/>
  <line x1="300" y1="55" x2="300" y2="100" stroke="#ff4500" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="380" y1="140" x2="305" y2="105" stroke="#ff4500" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="220" y1="140" x2="295" y2="105" stroke="#ff4500" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Vertex labels -->
  <text x="300" y="42" text-anchor="middle" fill="#fff" font-size="8" font-family="sans-serif" font-weight="bold">INTENT UNDERSTANDING</text>
  <text x="300" y="50" text-anchor="middle" fill="#666" font-size="6" font-family="sans-serif">Translating human thought into rigid structure</text>
  <text x="395" y="143" text-anchor="start" fill="#fff" font-size="8" font-family="sans-serif" font-weight="bold">MEMORY</text>
  <text x="395" y="151" text-anchor="start" fill="#666" font-size="6" font-family="sans-serif">An append-only history of truth</text>
  <text x="218" y="143" text-anchor="end" fill="#fff" font-size="8" font-family="sans-serif" font-weight="bold">EXPRESSION</text>
  <text x="218" y="151" text-anchor="end" fill="#666" font-size="6" font-family="sans-serif">Projecting domain into disposable code</text>

  <!-- "Learning" label -->
  <text x="300" y="175" text-anchor="middle" fill="#cc3700" font-size="8" font-family="sans-serif" font-weight="bold" opacity="0.6">LEARNING</text>

  <!-- Horizontal divider -->
  <line x1="30" y1="195" x2="570" y2="195" stroke="#333" stroke-width="1"/>

  <!-- Demo section heading -->
  <text x="300" y="220" text-anchor="middle" fill="#fff" font-size="14" font-family="sans-serif" font-weight="bold">See it in action</text>

  <!-- Preview card -->
  <rect x="80" y="235" width="440" height="95" fill="url(#glow)" rx="6"/>
  <rect x="81" y="236" width="438" height="93" fill="none" stroke="#444" stroke-width="1" rx="6"/>

  <!-- Play icon -->
  <polygon points="275,265 275,307 310,286" fill="#ff4500"/>

  <!-- "Chaos to Order" text on card -->
  <text x="330" y="275" fill="#ccc" font-size="12" font-family="sans-serif" font-weight="bold">Chaos → Order</text>
  <text x="330" y="292" fill="#888" font-size="9" font-family="sans-serif">Watch how fuzzy human intent is transformed into</text>
  <text x="330" y="306" fill="#888" font-size="9" font-family="sans-serif">a deterministic domain model in real-time</text>
</svg>
